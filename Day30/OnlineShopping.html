<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: skyblue;
        }

        h2 {
            color: hsl(326, 85%, 48%);
        }

        .cart-box {
            background: hsla(70, 9%, 87%, 0.969);
            width: 400px;
            height: 250px;;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>

<body>

    <div class="cart-box">
        <h2>ONLINE SHOPPING</h2>

        <p>Cart Count: <span id="count">0</span></p>

        <button onclick="addToCart()">Add Product 1</button>
        <button onclick="addToCart()">Add Product 2</button>
        <button onclick="addToCart()">Add Product 3</button>
    </div>

    <script>
        let cartCount = 0;

        function addToCart() {
            cartCount++;
            document.getElementById("count").textContent = cartCount;
        }
    </script>

</body>
</html>
