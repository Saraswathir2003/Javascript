<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typography & Spacing</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5 pb-4 bg-dark">
      <!-- Heading -->
      <h1 class="text-center text-primary mb-4">Healthy Food</h1>

      <!-- Short Paragraph -->
      <p class="text-center bg-white text-muted mb-4">
        Eating healthy food keeps our body strong and active.
      </p>

      <!-- Section -->
      <div class="bg-info p-3 mb-4" >
        <h4 class="text-success">Why It Need</h4>
        <p>Fruits and vegetables give us energy and help us stay fit.</p>
      </div>
    </div>
  </body>
</html>
