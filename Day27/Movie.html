<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Cards</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: black;
    }

    #movieContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .card {
      width: 200px;
      border: 1px solid #bd2424;
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 4px 8px rgba(206, 167, 167, 0.2);
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .card h3 {
        color:azure;
      margin: 10px 0;
    }
    .card:hover {
  transform: scale(1.05);
  transition: 0.3s;
  box-shadow: 0 8px 16px rgba(0,0,0,0.3);
}
  </style>
</head>
<body>

  <h1 style="text-align:center; color:aliceblue">Movie Lists</h1>

  <div id="movieContainer"></div>

  <script>
    // Movie data
    let movies = [
      {
        name: "SPIDER MAN",
        image: "image1.jpg"
      },
      {
        name: "LIK",
        image: "image2.jpg"
      },
      {
        name: "SIRAI",
        image: "image3.jpg"
      },
      {
        name:"WILD ROBOT",
        image:"image4.jpg"
      },
      {
        name:"TOY STORY",
        image:"image5.jpg"
      }

    ];

    let container = document.getElementById("movieContainer");

    movies.forEach(movie => {
      let card = document.createElement("div");
      card.className = "card";

      let img = document.createElement("img");
      img.src = movie.image;

      let title = document.createElement("h3");
      title.textContent = movie.name;

      card.appendChild(img);
      card.appendChild(title);

      container.appendChild(card);
    });
  </script>

</body>
</html>
