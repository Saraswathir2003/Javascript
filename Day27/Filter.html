<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Name Filter</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
      background-color: pink;
    }

    input {
      padding: 10px;
      width: 200px;
      margin-bottom: 20px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      padding: 8px;
      background: hwb(195 31% 20%);
      margin: 5px auto;
      width: 200px;
    }
  </style>
</head>
<body>

  <h2>Filter Names</h2>

  <input type="text" id="searchBox" placeholder="Type a name...">

  <ul id="nameList">
    <li>Saraswathi</li>
    <li>Priya</li>
    <li>Kavitha</li>
    <li>Divya</li>
    <li>Ravi</li>
    <li>Ramya</li>
  </ul>

  <script>
    let input = document.getElementById("searchBox");
    let list = document.getElementById("nameList");
    let items = list.getElementsByTagName("li");

    input.addEventListener("input", function () {
      let filter = input.value.toLowerCase();

      for (let i = 0; i < items.length; i++) {
        let text = items[i].textContent.toLowerCase();

        if (text.includes(filter)) {
          items[i].style.display = "";
        } else {
          items[i].style.display = "none";
        }
      }
    });
  </script>

</body>
</html>
