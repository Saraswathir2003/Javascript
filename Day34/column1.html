<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <div class="row">

    <div class="col-12 col-lg-6 bg-primary text-white p-3">
      Main Column

      <!-- Nested Row -->
      <div class="row mt-3">
        <div class="col-6 bg-light text-dark p-2">
          Sub Column A
        </div>
        <div class="col-6 bg-warning text-dark p-2">
          Sub Column B
        </div>
      </div>

    </div>

    <div class="col-12 col-lg-6 bg-success text-white p-3">
        Column
    </div>

  </div>
</div>

</body>
</html>
